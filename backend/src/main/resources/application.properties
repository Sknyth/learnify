spring.application.name=backend
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties]
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/learnify}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:local-dev-secret-change-before-deploy-1234567890}
jwt.expiration=${JWT_EXPIRATION:604800000}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.cookie-secure=${COOKIE_SECURE:false}

spring.application.name=backend
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties]
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/learnify}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false
spring.cache.type=redis

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:604800000}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.cookie-secure=${COOKIE_SECURE:false}
